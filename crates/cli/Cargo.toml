[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "assay"
path = "src/main.rs"

[dependencies]
# Imported under an alias: a dependency literally named `core` shadows Rust's built-in
# `core` crate in this crate's extern prelude, which breaks macros that expand to `core::`
# paths (clap's `version` derive). The package/folder name stays plain `core`.
corelib = { path = "../core", package = "core" }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
