[package]
name = "webview-qa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "webview-qa"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
clap = { workspace = true }
# ws:// to localhost DevTools only — handshake needed, TLS deliberately not.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = { workspace = true }
