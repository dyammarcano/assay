[package]
name = "core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
roxmltree = "0.20"
serde_json = "1"

# App discovery is Windows-only: WindowsApps denies directory listing, so the installed UWP set
# has to come from the registry, and matching a running process to its install root needs the
# process's executable path.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
insta = { workspace = true }
syn = { version = "2", features = ["full"] }
tempfile = { workspace = true }
